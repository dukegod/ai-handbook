<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Claude Handbook favicon">
  <!-- Favicon · 主星 + 一颗小行星（16×16 也可辨识）
       去掉主 logo 的斜环 —— 小尺寸下环容易糊成一团线。 -->
  <g fill="#c96442">
    <!-- 主星 8-芒 · 简化为粗辐射（每条更粗才在 16×16 可见）-->
    <path d="M16 3 L17 14 L16 16 L15 14 Z"/>
    <path d="M16 29 L17 18 L16 16 L15 18 Z"/>
    <path d="M3 16 L14 15 L16 16 L14 17 Z"/>
    <path d="M29 16 L18 15 L16 16 L18 17 Z"/>
    <path d="M7 7 L15 15 L16 16 L14.5 14.5 Z"/>
    <path d="M25 7 L17 15 L16 16 L17.5 14.5 Z"/>
    <path d="M7 25 L15 17 L16 16 L14.5 17.5 Z"/>
    <path d="M25 25 L17 17 L16 16 L17.5 17.5 Z"/>
    <!-- 中心圆 -->
    <circle cx="16" cy="16" r="2"/>
    <!-- 右上角一颗小行星（favicon 身份识别点）-->
    <circle cx="27" cy="6" r="1.8"/>
  </g>
</svg>
