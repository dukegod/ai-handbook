# lychee 死链检查配置
# 文档：https://lychee.cli.rs/
# v0.4.1 引入——防 sidebar 🚧 漏修 / 内部链接错位（v0.3.1 收尾教训）
# v0.4.2 升级——适配 lychee 0.24.x schema（verbose 字符串、accept 数组、root_dir 等）
# v0.4.2 升级——failMode=error 阶段
# 已知问题（v0.4.2 文档）：中文锚点（VitePress 与 GFM slug 算法不一致）/ 跨页内部 anchor 仍 false positive

# Verbose 模式（CI 关闭噪音）
# lychee 0.24+ 接受：error / warn / info / debug / trace
verbose = "warn"

# Accept 状态码（数组）
accept = [200, 203, 206, 301, 302, 303, 304, 307, 308]

# 超时（秒）
timeout = 20

# 重试次数
max_retries = 3

# 重试间隔（秒）
retry_wait_time = 2

# 重定向上限
max_redirects = 5

# User-Agent
user_agent = "Mozilla/5.0 (compatible; claude-handbook-link-checker/1.0; +https://coding.jd.com/sz-fe/claude-wiki)"

# 排除路径（正则字符串）—— 不检查生成产物
exclude_path = [
    "(^|/)node_modules",
    "(^|/)\\.vitepress",
    "(^|/)public",
    "(^|/)assets",
    "(^|/)\\.lycheecache",
    "(^|/)scripts/\\.lychee-out",
]

# 排除 URL（正则）—— 已知会失败 / 不需要检查
exclude = [
    # 本地开发链接
    "^http://localhost",
    "^http://127\\.0\\.0\\.1",
    "^https://localhost",
    # mailto 链接
    "^mailto:",
    # 公司内 Git（CI runner 访问不到，false positive）
    "^https?://coding\\.jd\\.com",
    # VitePress public 资源（public/ 下的 svg 由 VitePress 映射到 /，lychee 不知道映射）
    "logo\\.svg$",
    "hero\\.svg$",
    "favicon\\.svg$",
    "favicon\\.ico$",
    # claude.ai 拒绝 lychee 爬虫（403）
    "^https?://(www\\.)?claude\\.ai",
    # aws.amazon.com 超时严重
    "^https?://aws\\.amazon\\.com/bedrock",
    # docs.claude.com 旧 URL 全部 redirect 到 platform.claude.com
    # 但 platform 上对应 URL 仍 404（平台迁移中）—— 已知 false positive
    "^https?://docs\\.claude\\.com/en/docs/",
    # platform.claude.com 上已废弃的旧 API 路径（v0.4.2 阶段平台迁移未完成）
    "^https?://platform\\.claude\\.com/docs/en/api/administration",
    "^https?://platform\\.claude\\.com/docs/en/api/usage",
    "^https?://platform\\.claude\\.com/docs/en/api/files$",
    # platform 上锚点（如 messages#stream / messages#tool-use）已迁移到新页面
    "^https?://platform\\.claude\\.com/docs/en/api/messages#",
    # 旧 docs.claude.com 锚点（含 /rules 等路径里有 / 字符导致 lychee 误判）
    "^https?://code\\.claude\\.com/docs/en/memory#",
    # code.claude.com 文档已迁移（v0.4.2 阶段）
    "^https?://code\\.claude\\.com/docs/en/commit$",
    # npmjs 反爬 403（已知 lychee 不被允许）
    "^https?://(www\\.)?npmjs\\.com/package/",
    # Anthropic research 论文已迁出 anthropic.com/research（v0.4.2 阶段 false positive）
    "^https?://(www\\.)?anthropic\\.com/research",
    # Slack marketplace 链接已迁移到子路径
    "^https?://slack\\.com/apps/.*-claude$",
    # openai.com 反爬 403（同 npmjs / claude.ai 模式）
    "^https?://(www\\.)?openai\\.com",
    # platform.openai.com 需 JS 渲染，curl / lychee 均超时
    "^https?://platform\\.openai\\.com",
    # chat.lmsys.org 网络层屏蔽（154.83.x.x 网段本地与 CI 均不可达，lmarena.ai 同段）
    "^https?://chat\\.lmsys\\.org",
]

# 缓存（加速重复运行）
cache = true

# 缓存有效期
max_cache_age = "2d"

# 缓存排除状态码
cache_exclude_status = "500.."

# Fallback 扩展（无扩展名链接尝试 .md）
fallback_extensions = ["md", "html"]

# 最大并发
max_concurrency = 14

# 最小主机请求间隔（避免被 ban）
host_request_interval = "50ms"

# Include 列表（v0.4.2：用 toml 配 include 替代 CLI 多 glob 参数）
# CLI 多 glob 在 lychee 0.24.2 有 glob 解析 bug，单个 **/*.md OK 但配合 exclude glob 会报
# 注意：lychee 0.24 把 include 数组当 regex 解析（"**/*.md" 会报 repetition operator 错）
# 实际 inputs 通过 CLI --files-from 传入（见 scripts/check-links.sh）

# Skip missing input files
skip_missing = true

# root_dir（用于解析 root-relative 链接）—— 在 CI workflow 里设 ${{ github.workspace }}
# 在本地用 check-links.sh 设 $(pwd)
# 注意：include_fragments 在 v0.4.2 暂不开启，因为 VitePress 与 GFM slug 算法不一致
# 见 contributing/link-checking.md「已知限制」段
